<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CityU FOIT Listed Subjects</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="page-wrapper">

    <header>
        <h1>📘 Subject & Class Information</h1>
        <p>Faculty of Information Technology</p>
        <p>City University Malaysia</p>
    </header>

    <!-- Lecturer Scroll Section -->
    <section class="lecturer-section">

        <div class="lecturer-scroll-wrapper">
            <button id="showAllBtn" class="show-all-btn">Show All</button>

            <button class="scroll-btn left" onclick="scrollLecturers(-200)">◀</button>

            <div class="lecturer-list" id="lecturerList">
                <!-- Lecturer items injected here -->
            </div>

            <button class="scroll-btn right" onclick="scrollLecturers(200)">▶</button>
        </div>

    </section>

    <!-- Subject Cards -->
    <main>
        <div id="subject-container" class="card-container">
            <!-- Cards injected here -->
        </div>
    </main>

    <footer>
        Managed by <strong>Faculty of Information Technology</strong>,
        City University Malaysia
    </footer>

</div>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="js/script.js"></script>

</body>
</html>
